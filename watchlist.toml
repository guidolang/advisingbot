# Which courses AdvisingBot checks for open seats.
#
# Each [[watch]] block is one search in Self-Service: a subject code, plus the
# academic levels to include. Optionally narrow it to specific course numbers.
#
#   subject  Self-Service subject code (BAN, CIS, MK, MG, IB, FIN, AC, EC, ...)
#            Run `python3 advisingbot.py --list-subjects` to see them all.
#   levels   "UG" undergraduate, "GR" graduate, "DL" doctorate, "LW" law.
#            Omit to include every level.
#   courses  Optional. Only these course numbers. Omit to take the whole
#            subject at the levels above.
#   exclude  Optional. Course numbers to skip.
#   label    Optional. How this block is titled in the report.

# --- Business Analytics: everything, undergraduate and graduate -------------
[[watch]]
label = "Business Analytics (all levels)"
subject = "BAN"
levels = ["UG", "GR"]

# --- Computer Information Systems: all undergraduate ------------------------
[[watch]]
label = "Computer Information Systems (undergraduate)"
subject = "CIS"
levels = ["UG"]

# --- Selected courses in other disciplines ----------------------------------
# These are seeded as whole-subject watches so you see everything on the first
# run. Once you know which courses you actually advise into, uncomment the
# `courses` line and list them, e.g. courses = ["101", "210", "350"].

[[watch]]
label = "Marketing (selected)"
subject = "MK"
levels = ["UG", "GR"]
# courses = ["101", "310"]

[[watch]]
label = "Management (selected)"
subject = "MG"
levels = ["UG", "GR"]
# courses = ["210", "220"]

[[watch]]
label = "International Business (selected)"
subject = "IB"
levels = ["UG", "GR"]
# courses = ["201"]
