# What AdvisingBot checks for open seats.
#
# This file is hand-maintained. Elective courses in other disciplines are NOT
# listed here - they are read from the catalog into programs.json by
# `python3 build_catalog.py` and picked up automatically.
#
# Each [[watch]] block is one search in Self-Service:
#
#   subject  Self-Service subject code. Run `--list-subjects` to see them all.
#   levels   "UG" undergraduate, "GR" graduate, "DL" doctorate, "LW" law.
#            Omit to include every level.
#   courses  Optional. Only these course numbers. Omit for the whole subject.
#   exclude  Optional. Course numbers to skip.
#   label    Optional. How this block is titled in the report.

# --- Business Analytics: everything, undergraduate and graduate -------------
# Also satisfies the "Any BAN course" elective rule in the AI & BAN minor.
[[watch]]
label = "Business Analytics (all levels)"
subject = "BAN"
levels = ["UG", "GR"]

# --- Computer Information Systems: all undergraduate ------------------------
# Also satisfies the CIS elective rules in the BS and the minor, both of which
# read "any 200 level or above CIS class".
[[watch]]
label = "Computer Information Systems (undergraduate)"
subject = "CIS"
levels = ["UG"]


# ---------------------------------------------------------------------------
# Electives the catalog misses
# ---------------------------------------------------------------------------
# The catalog states some elective requirements as prose rather than a course
# list - "Take one 600-level MK course", for instance - and those courses
# never make it into electives.toml. List them here and they get checked
# alongside the harvested ones.
#
# Write them as "SUBJ NUM". Anything already in electives.toml is ignored, so
# duplicates are harmless.

# Which catalog programs to draw electives from. programs.json holds every
# School of Business curriculum; without this filter, "electives" would mean
# every elective in the school. Matched as case-insensitive substrings.
[electives]
programs = [
  "Applied AI and Business Analytics",
  "Computer Information Systems",
]

[manual]
courses = [
  # "MK 630",   # covers "Take one 600-level MK course" (MS AI & BAN)
  # "HM 610",   # covers "Take one other 600-level HM or BAN elective"
]
