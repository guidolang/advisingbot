<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AdvisingBot</title>
<style>
:root {
  color-scheme: light dark;
  --bg:#f6f7f9; --card:#fff; --ink:#14181f; --muted:#5b6472; --line:#dfe3e9;
  --accent:#0b4d8f; --accent-soft:#e8f0fa;
  --good:#126b3f; --good-soft:#e4f4ea;
  --warn:#8a5a00; --warn-soft:#fdf1dc;
  --dim:#8b95a3; --radius:10px;
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#0f1216; --card:#171c22; --ink:#e8ecf1; --muted:#9aa5b4;
    --line:#2a323c; --accent:#6ba9ee; --accent-soft:#17293d;
    --good:#6bd39b; --good-soft:#14301f; --warn:#e3b25f; --warn-soft:#33270f;
    --dim:#6c7787; }
}
*{box-sizing:border-box}
/* Author display rules outrank the browser's [hidden] rule, so anything
   using display:flex would stay on screen while marked hidden. */
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:24px 18px 64px}
h1{margin:0 0 18px;font-size:2rem;letter-spacing:-.02em}

.panel{background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);padding:16px;margin-bottom:18px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row input[type=text]{flex:1;min-width:280px;font:inherit;padding:9px 11px;
  border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink)}
button{font:inherit;font-weight:600;padding:9px 16px;border-radius:7px;
  border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--accent)}
button:disabled{opacity:.55;cursor:default}
input:focus-visible,select:focus-visible,button:focus-visible{
  outline:2px solid var(--accent);outline-offset:1px}
.studentbar{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;
  justify-content:space-between;background:var(--card);
  border:1px solid var(--line);border-radius:var(--radius);
  padding:13px 16px;margin-bottom:16px}
.studentbar .field{min-width:190px}
.onlyterm{font-weight:600;padding:8px 0}
.badge{display:inline-block;margin-left:8px;font-size:.66rem;font-weight:700;
  text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;
  border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:.72rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.05em;color:var(--muted)}
select{font:inherit;padding:8px 10px;border:1px solid var(--line);
  border-radius:7px;background:var(--card);color:var(--ink);width:100%}

.who{margin:0 0 6px;font-size:1.05rem;font-weight:700}
.meta{color:var(--muted);font-size:.85rem;margin:0}
.status{color:var(--muted);font-size:.9rem;padding:10px 0}
.error{background:var(--warn-soft);color:var(--warn);padding:12px 14px;
  border-radius:8px;border-left:3px solid currentColor;margin:14px 0}

.listcard{background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);padding:4px 16px 10px}

.course{border-top:1px solid var(--line);padding:12px 0 4px}
.course:first-of-type{border-top:0}
.chead{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.code{font-weight:700;font-variant-numeric:tabular-nums}
.ctitle{color:var(--muted);font-size:.92rem;flex:1;min-width:140px}
.pill{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px;
  background:var(--good-soft);color:var(--good);white-space:nowrap}
.mode{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}

.secs{list-style:none;margin:7px 0 0;padding:0}
.sec{padding:6px 0 6px 11px;border-left:2px solid var(--line);margin-bottom:5px}
.sec-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sec-name{font-weight:600;font-size:.9rem;font-variant-numeric:tabular-nums}
.sec-meta{color:var(--muted);font-size:.83rem;margin-top:2px}
.sec-meta span::after{content:" · "}
.sec-meta span:last-child::after{content:""}
details>summary{cursor:pointer;font-size:.85rem;color:var(--accent);font-weight:600;
  padding:3px 0;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸ ";display:inline-block;width:1em}
details[open]>summary::before{content:"▾ "}

.copybox{position:relative}
textarea{width:100%;min-height:220px;font:13px/1.5 ui-monospace,SFMono-Regular,
  Menlo,Consolas,monospace;padding:12px;padding-right:52px;border-radius:8px;
  border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
.copy{position:absolute;top:10px;right:10px;padding:6px 10px;font-size:.8rem}
/* Set the copy block apart from the course list above it. */
#copypanel{margin-top:34px}
</style>
</head>
<body>
<div class="wrap">
<h1>AdvisingBot</h1>

<div class="panel">
  <form class="row" id="form">
    <input type="text" id="url" autocomplete="off" spellcheck="false"
      placeholder="https://qu.stellic.com/app/audit?student_username=…">
    <button type="submit" id="go">Check</button>
  </form>
</div>

<div class="studentbar" id="who" hidden>
  <div class="whotext"></div>
  <div class="field" id="termfield" hidden>
    <label for="term">Semester</label>
    <select id="term"></select>
    <span class="onlyterm" id="termone" hidden></span>
  </div>
</div>

<div id="status" class="status"></div>
<main id="out"></main>

<div class="panel" id="copypanel" hidden>
  <div class="field"><label for="plain">Copy for notes or email</label></div>
  <div class="copybox">
    <textarea id="plain" readonly></textarea>
    <button class="ghost copy" id="copy" type="button" title="Copy to clipboard">
      ⧉ Copy
    </button>
  </div>
</div>

</div>

<script>
let DATA = null;

const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;  // textContent: never inject
  return n;
};
const MODE = {online:"Online", "on-ground":"On ground", hybrid:"Hybrid"};

function matches(sec, term, mode) {
  if (sec.term !== term) return false;
  if (mode === "any") return true;
  if (mode === "online") return sec.delivery === "online" || sec.delivery === "hybrid";
  return sec.delivery === "on-ground" || sec.delivery === "hybrid";
}

function deliveryOf(secs) {
  const on = secs.some(s => s.delivery === "online" || s.delivery === "hybrid");
  const gr = secs.some(s => s.delivery === "on-ground" || s.delivery === "hybrid");
  return on && gr ? "both" : on ? "online" : gr ? "on-ground" : "none";
}
const DELIVERY_LABEL = {both:"online + on-ground", online:"online", "on-ground":"on-ground"};

function currentTerm(terms) {
  const today = new Date().toISOString().slice(0,10);
  const now = terms.find(t => t.start && t.end && t.start <= today && today <= t.end);
  if (now) return now.code;
  const next = terms.filter(t => t.start && t.start > today)
                    .sort((a,b) => a.start.localeCompare(b.start))[0];
  return (next || terms[0] || {}).code;
}

function renderSection(s) {
  const li = el("li","sec");
  const top = el("div","sec-top");
  top.append(el("span","sec-name",s.name));
  top.append(el("span","pill", s.seats === null ? s.display
                              : `${s.seats} of ${s.capacity} open`));
  top.append(el("span","mode", MODE[s.delivery] || s.delivery));
  li.append(top);
  const meta = el("div","sec-meta");
  for (const bit of [s.meets, s.location, s.instructor, s.credits ? s.credits+" cr" : ""])
    if (bit) meta.append(el("span",null,bit));
  if (meta.childNodes.length) li.append(meta);
  return li;
}

function render() {
  const term = document.getElementById("term").value;
  // Students in an online programme cannot attend classroom sections, so the
  // delivery filter follows their programme instead of being a choice.
  const mode = DATA && DATA.student.online_only ? "online" : "any";
  const out = document.getElementById("out");
  out.replaceChildren();
  if (!DATA) return;

  // One entry per course, in the order the audit first asks for it, so
  // required courses come before elective options. A course that could
  // satisfy several requirements is still just one course to register for.
  const unique = new Map();
  for (const req of DATA.requirements)
    for (const course of req.courses)
      if (!unique.has(course.code)) unique.set(course.code, course);

  const rows = [];
  for (const course of unique.values()) {
    const secs = (course.sections || []).filter(s => matches(s, term, mode));
    if (secs.length) rows.push({course, secs});
  }

  if (rows.length) {
    const card = el("div","listcard");
    rows.forEach(r => card.append(renderCourse(r.course, r.secs)));
    out.append(card);
  } else {
    out.append(el("p","status",
      "Nothing still needed has open seats this semester."));
  }

  document.getElementById("plain").value = rows.map(({course, secs}) =>
    `${course.code.padEnd(9)} ${(course.title||"").slice(0,38).padEnd(40)}`
    + `${String(secs.reduce((n,s)=>n+(s.seats||0),0)).padStart(3)} seats  `
    + `[${DELIVERY_LABEL[deliveryOf(secs)]}]`).join("\n");
  document.getElementById("copypanel").hidden = rows.length === 0;

  document.getElementById("status").textContent =
    `${rows.length} course${rows.length===1?"":"s"} with open seats`;
}

function renderCourse(course, secs) {
  const box = el("div","course");
  const head = el("div","chead");
  head.append(el("span","code", course.code));
  head.append(el("span","ctitle", course.title || ""));
  head.append(el("span","pill",
    secs.reduce((n,s)=>n+(s.seats||0),0) + " seats"));
  head.append(el("span","mode", DELIVERY_LABEL[deliveryOf(secs)]));
  box.append(head);

  const list = el("ul","secs");
  if (secs.length === 1) {
    list.append(renderSection(secs[0]));
    box.append(list);
  } else {
    const d = el("details");
    d.append(el("summary", null, `${secs.length} sections with open seats`));
    secs.forEach(x => list.append(renderSection(x)));
    d.append(list);
    box.append(d);
  }
  return box;
}

function showStudent() {
  const bar = document.getElementById("who");
  const text = bar.querySelector(".whotext");
  text.replaceChildren();
  if (!DATA) { bar.hidden = true; return; }

  text.append(el("p","who", DATA.student.name
    + (DATA.student.level ? ` — ${DATA.student.level}` : "")));
  const meta = el("p","meta", DATA.student.programs.join(" · "));
  if (DATA.student.online_only)
    meta.append(el("span","badge","online — online sections only"));
  text.append(meta);
  bar.hidden = false;
}

async function check(ev) {
  ev.preventDefault();
  const url = document.getElementById("url").value.trim();
  if (!url) return;
  const go = document.getElementById("go");
  go.disabled = true;
  document.getElementById("out").replaceChildren();
  document.getElementById("who").hidden = true;
  document.getElementById("copypanel").hidden = true;
  document.getElementById("status").textContent =
    "Opening the audit in Stellic and checking Self-Service — this takes a moment…";

  try {
    const r = await fetch("/api/check?url=" + encodeURIComponent(url));
    const body = await r.json();
    if (!r.ok) throw new Error(body.error || ("HTTP " + r.status));
    DATA = body;
    try { localStorage.setItem("advisingbot.url", url); } catch (e) {}

    const termSel = document.getElementById("term");
    termSel.replaceChildren();
    for (const t of DATA.terms) {
      const o = el("option",null,t.description); o.value = t.code; termSel.append(o);
    }
    if (DATA.terms.length) termSel.value = currentTerm(DATA.terms);
    // A dropdown holding one option is furniture, but the term still has to
    // be visible - so show it as plain text instead.
    const field = document.getElementById("termfield");
    const only = document.getElementById("termone");
    field.hidden = DATA.terms.length === 0;
    termSel.hidden = DATA.terms.length < 2;
    only.hidden = DATA.terms.length !== 1;
    if (DATA.terms.length === 1) only.textContent = DATA.terms[0].description;
    showStudent();
    render();
  } catch (err) {
    document.getElementById("status").textContent = "";
    const box = el("div","error");
    box.append(el("strong",null,"Could not read that audit. "));
    box.append(document.createTextNode(err.message));
    document.getElementById("out").append(box);
  } finally {
    go.disabled = false;
  }
}

document.getElementById("form").addEventListener("submit", check);
document.getElementById("term").addEventListener("change", render);

document.getElementById("copy").addEventListener("click", async () => {
  const box = document.getElementById("plain");
  const btn = document.getElementById("copy");
  try {
    await navigator.clipboard.writeText(box.value);
  } catch (e) {
    box.select(); document.execCommand("copy");   // older browsers
  }
  btn.textContent = "✓ Copied";
  setTimeout(() => { btn.textContent = "⧉ Copy"; }, 1600);
});

try {
  const last = localStorage.getItem("advisingbot.url");
  if (last) document.getElementById("url").value = last;
} catch (e) {}
</script>
</body>
</html>
