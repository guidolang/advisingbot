<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AdvisingBot</title>
<style>
:root {
  color-scheme: light;
  --bg:#fff; --card:#fff; --ink:#333; --muted:#333; --line:#d3d8de;
  --accent:#333; --accent-soft:#f9f9f9; --good:#333; --good-soft:#f9f9f9;
  --warn:#d30303; --warn-soft:#fff5f5; --available:rgb(47,167,127);
  --dim:#333; --radius:4px;
}
*{box-sizing:border-box}
/* Author display rules outrank the browser's [hidden] rule, so anything
   using display:flex would stay on screen while marked hidden. */
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:24px 18px 64px}
h1{margin:0 0 18px;font-size:2rem;letter-spacing:-.02em}

.panel{background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);padding:16px;margin-bottom:18px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row input[type=text]{flex:1;min-width:280px;font:inherit;padding:9px 11px;
  border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--ink)}
button{font:inherit;font-weight:600;padding:9px 16px;border-radius:4px;
  border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--accent)}
button:disabled{opacity:.55;cursor:default}
input:focus-visible,select:focus-visible,button:focus-visible{
  outline:2px solid var(--accent);outline-offset:1px}
.studentbar{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;
  justify-content:space-between;background:var(--card);
  border:1px solid var(--line);border-radius:var(--radius);
  padding:13px 16px;margin-bottom:16px}
.studentbar .field{min-width:190px}
.filters{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.onlyterm{font-weight:600;padding:8px 0}
.badge{display:inline-block;margin-left:8px;font-size:.66rem;font-weight:700;
  text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;
  border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:.72rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.05em;color:var(--muted)}
select{font:inherit;padding:8px 10px;border:1px solid var(--line);
  border-radius:4px;background:var(--card);color:var(--ink);width:100%}

.who{margin:0 0 6px;font-size:1.05rem;font-weight:700}
.meta{color:var(--muted);font-size:.85rem;margin:0}
.status{color:var(--muted);font-size:.9rem;padding:10px 0}
.update{background:var(--accent-soft);border:1px solid var(--line);
  border-left:3px solid var(--accent);border-radius:var(--radius);
  padding:12px 14px;margin-bottom:18px}
.update p{margin:0 0 8px}
.update textarea{min-height:86px;padding-right:12px;font-size:.82rem}
.update .copy{position:static;margin-top:8px}
.error{background:var(--warn-soft);color:var(--warn);padding:12px 14px;
  border-radius:4px;border-left:3px solid currentColor;margin:14px 0}

.course{background:#fff;border:1px solid var(--line);border-radius:4px;
  padding:11px 13px 10px;margin:8px 0}
.chead{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.course-mark,.req-mark{display:inline-grid;place-items:center;flex:none;width:34px;height:34px;
  border:1px solid var(--warn);border-radius:4px;color:var(--warn);font-weight:700;
  font-variant-numeric:tabular-nums}
.course-mark{width:34px;height:34px;border-color:var(--available);
  background:var(--available);color:#fff;font-size:1.1rem}
.code{font-weight:750;font-variant-numeric:tabular-nums;color:var(--ink)}
.ctitle{color:var(--ink);font-size:.92rem;flex:1;min-width:140px}
.pill{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px;
  background:var(--good-soft);color:var(--good);white-space:nowrap}
.mode{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  padding:2px 7px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.audit-tree{padding:2px 0 8px}
.tree-children{position:relative;margin:10px 0 0 27px;padding-left:26px}
.tree-children::before{content:"";position:absolute;left:0;top:-10px;bottom:23px;
  border-left:1px solid var(--line)}
.tree-node{position:relative}
.tree-node + .tree-node{margin-top:10px}
.tree-node.connected::before{content:"";position:absolute;left:-26px;top:23px;width:26px;
  border-top:1px solid var(--line)}
.tree-children > .tree-node:last-child::after{content:"";position:absolute;left:-27px;top:24px;bottom:0;width:2px;
  background:var(--bg)}
.requirement{background:#f9f9f9;border:1px solid var(--line);border-radius:4px;
  padding:12px 12px 10px;margin:0}
.req-head{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:8px;
  align-items:baseline;background:#f9f9f9;padding:3px 0}
.req-title{margin:0;font-size:.98rem;font-weight:750;color:var(--ink)}
.req-meta{color:var(--muted);font-size:.83rem;margin:4px 0 8px}
.req-rule{font-style:italic}
.courses-label{display:block;color:var(--muted);font-size:.7rem;font-weight:750;
  letter-spacing:.07em;text-transform:uppercase;margin:11px 0 5px}
.course-list{padding-left:0}
.more-courses{margin:8px 0 0}

.secs{list-style:none;margin:7px 0 0;padding:0}
.sec{padding:6px 0 6px 11px;border-left:2px solid var(--available);margin-bottom:5px}
.sec-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sec-name{font-weight:600;font-size:.9rem;font-variant-numeric:tabular-nums}
.sec-meta{color:var(--muted);font-size:.83rem;margin-top:2px}
.sec-meta span::after{content:" · "}
.sec-meta span:last-child::after{content:""}
details>summary{cursor:pointer;font-size:.85rem;color:var(--accent);font-weight:600;
  padding:3px 0;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸ ";display:inline-block;width:1em}
details[open]>summary::before{content:"▾ "}

.copybox{position:relative}
textarea{width:100%;min-height:220px;font:13px/1.5 ui-monospace,SFMono-Regular,
  Menlo,Consolas,monospace;padding:12px;padding-right:52px;border-radius:4px;
  border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
.copy{position:absolute;top:10px;right:10px;padding:6px 10px;font-size:.8rem}
/* Set the copy block apart from the course list above it. */
#copypanel{margin-top:34px}
</style>
</head>
<body>
<div class="wrap">
<h1>AdvisingBot</h1>

<section class="update" id="update" hidden>
  <p><strong>An AdvisingBot update is available.</strong> Copy this prompt into Codex to update it:</p>
  <textarea id="updateprompt" readonly></textarea>
  <button class="ghost copy" id="copyupdate" type="button">⧉ Copy update prompt</button>
</section>

<div class="panel">
  <form class="row" id="form">
    <input type="text" id="url" autocomplete="off" spellcheck="false"
      placeholder="https://qu.stellic.com/app/audit?student_username=…">
    <button type="submit" id="go">Check</button>
  </form>
</div>

<div class="studentbar" id="who" hidden>
  <div class="whotext"></div>
  <div class="filters" id="filters" hidden>
    <div class="field" id="modalityfield">
      <label for="modality">Modality</label>
      <select id="modality">
        <option value="any">Online + On-ground</option>
        <option value="online">Online</option>
        <option value="on-ground">On-ground</option>
      </select>
    </div>
    <div class="field" id="termfield">
      <label for="term">Semester</label>
      <select id="term"></select>
      <span class="onlyterm" id="termone" hidden></span>
    </div>
  </div>
</div>

<div id="status" class="status"></div>
<main id="out"></main>

<div class="panel" id="copypanel" hidden>
  <div class="field"><label for="plain">Copy Notes</label></div>
  <div class="copybox">
    <textarea id="plain" readonly></textarea>
    <button class="ghost copy" id="copy" type="button" title="Copy to clipboard">
      ⧉ Copy
    </button>
  </div>
</div>

</div>

<script>
let DATA = null;
let CHECKING = false;
let loadingDots = 3;
let loadingTimer = null;

const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;  // textContent: never inject
  return n;
};
const MODE = {online:"Online", "on-ground":"On ground", hybrid:"Hybrid"};

function matches(sec, term, mode) {
  if (sec.term !== term) return false;
  if (mode === "any") return true;
  if (mode === "online") return sec.delivery === "online" || sec.delivery === "hybrid";
  return sec.delivery === "on-ground" || sec.delivery === "hybrid";
}

function deliveryOf(secs) {
  const on = secs.some(s => s.delivery === "online" || s.delivery === "hybrid");
  const gr = secs.some(s => s.delivery === "on-ground" || s.delivery === "hybrid");
  return on && gr ? "both" : on ? "online" : gr ? "on-ground" : "none";
}
const DELIVERY_LABEL = {both:"online + on-ground", online:"online", "on-ground":"on-ground"};

function latestTerm(terms) {
  const dated = terms.filter(t => t.start)
    .sort((a, b) => a.start.localeCompare(b.start));
  return (dated[dated.length - 1] || terms[terms.length - 1] || {}).code;
}

function renderSection(s) {
  const li = el("li","sec");
  const top = el("div","sec-top");
  top.append(el("span","sec-name",s.name));
  top.append(el("span","pill", s.seats === null ? s.display
                              : `${s.seats} of ${s.capacity} open`));
  top.append(el("span","mode", MODE[s.delivery] || s.delivery));
  li.append(top);
  const meta = el("div","sec-meta");
  for (const bit of [s.meets, s.location, s.instructor, s.credits ? s.credits+" cr" : ""])
    if (bit) meta.append(el("span",null,bit));
  if (meta.childNodes.length) li.append(meta);
  return li;
}

function render() {
  const term = document.getElementById("term").value;
  // A programme title does not establish a student's registration modality.
  // Keep all open sections visible by default and let the adviser choose a
  // delivery filter when the student's situation calls for one.
  const mode = document.getElementById("modality").value;
  const out = document.getElementById("out");
  out.replaceChildren();
  if (!DATA) return;

  // A course the student has already taken, cannot take yet, or that is
  // written for another programme has open seats and is still not advice.
  // It is set aside rather than dropped, so the reason stays checkable.
  // Keep the audit's requirement branches. A course can deliberately appear
  // under more than one branch when it can count toward more than one need.
  const branches = [], held = [];
  for (const requirement of DATA.requirements) {
    const courses = [];
    for (const course of requirement.courses) {
      const secs = (course.sections || []).filter(s => matches(s, term, mode));
      if (!secs.length) continue;
      if (course.blocked) held.push({course, requirement});
      else courses.push({course, secs});
    }
    branches.push({requirement, courses});
  }
  const rows = branches.filter(branch => branch.courses.length);

  if (!rows.length) {
    out.append(el("p","status",
      "Nothing still needed has open seats this semester."));
  }
  out.append(renderRequirementTree(branches));
  if (held.length) out.append(renderHeld(held));

  document.getElementById("plain").value = copyNotes(rows).join("\n");
  document.getElementById("copypanel").hidden = !rows.length;

  const available = new Set(rows.flatMap(branch =>
    branch.courses.map(({course}) => course.code))).size;
  const status = `${available} course${available===1?"":"s"} with open seats`;
  document.getElementById("status").textContent = held.length
    ? `${status} · ${held.length} set aside`
    : status;
}

// "CIS 101: Introduction to Applied AI & Analytics (Online: 3 available seats,
//  In-person: 6 available seats)" - one course per line, nothing padded, so it
// reads as a sentence wherever it is pasted.
function copyLine(course, secs) {
  const seats = mode => secs
    .filter(s => s.delivery === mode || s.delivery === "hybrid")
    .reduce((n, s) => n + (s.seats || 0), 0);
  const parts = [];
  for (const [m, label] of [["online","Online"], ["on-ground","In-person"]]) {
    const n = seats(m);
    if (n) parts.push(`${label}: ${n} available seat${n === 1 ? "" : "s"}`);
  }
  const tail = parts.length ? ` (${parts.join(", ")})` : "";
  return `- ${course.code}: ${course.title || ""}${tail}`;
}

function ucCategory(requirement) {
  if (!/\bUC_(?:FA|HU|SS|NS)\b/.test((requirement.rules || []).join(" ")))
    return null;
  const name = (requirement.name || "").replace(/^\s*\d+\.\s*/, "")
    .replace(/^University Curriculum\s*/i, "").trim();
  return name ? `UC ${name}` : "University Curriculum";
}

function copyNotes(rows) {
  const items = [], seen = new Map();
  for (const {requirement, courses} of rows) {
    const category = ucCategory(requirement);
    if (category) {
      const key = `category:${category}`;
      let item = seen.get(key);
      if (!item) {
        item = {category, needed: 0, courses: new Map()};
        seen.set(key, item); items.push(item);
      }
      item.needed += requirement.slots || 1;
      courses.forEach(({course, secs}) => item.courses.set(course.code, {course, secs}));
      continue;
    }
    courses.forEach(({course, secs}) => {
      const key = `course:${course.code}`;
      if (!seen.has(key)) {
        const item = {course, secs};
        seen.set(key, item); items.push(item);
      }
    });
  }
  return items.map(item => {
    if (!item.category) return copyLine(item.course, item.secs);
    const needed = item.needed;
    const available = item.courses.size;
    return `- ${needed} course${needed === 1 ? " that fulfills" : "s that fulfill"} ${item.category} (${available} course${available === 1 ? "" : "s"} with available seats)`;
  });
}

const HELD_LABEL = {taken:"Already taken", prerequisite:"Prerequisite not met",
                    programme:"Written for another programme"};

function renderHeld(held) {
  const box = el("details","panel");
  box.append(el("summary", null,
    `${held.length} course${held.length===1?"":"s"} with seats, set aside`));
  const list = el("ul","secs");
  for (const {course, requirement} of held) {
    const li = el("li","sec");
    const top = el("div","sec-top");
    top.append(el("span","sec-name", course.code));
    top.append(el("span","ctitle", course.title || ""));
    top.append(el("span","mode", HELD_LABEL[course.blocked.reason] || ""));
    li.append(top);
    const detail = course.blocked.detail || "";
    li.append(el("div","sec-meta",
      `${requirement.name} — ${detail}`));
    list.append(li);
  }
  box.append(list);
  return box;
}

function renderCourse(course, secs) {
  const box = el("div","course");
  const head = el("div","chead");
  head.append(el("span", "course-mark", "?"));
  head.append(el("span","code", course.code));
  head.append(el("span","ctitle", course.title || ""));
  head.append(el("span","pill",
    secs.reduce((n,s)=>n+(s.seats||0),0) + " seats"));
  head.append(el("span","mode", DELIVERY_LABEL[deliveryOf(secs)]));
  box.append(head);

  const list = el("ul","secs");
  if (secs.length === 1) {
    list.append(renderSection(secs[0]));
    box.append(list);
  } else {
    const d = el("details");
    d.append(el("summary", null, `${secs.length} sections with open seats`));
    secs.forEach(x => list.append(renderSection(x)));
    d.append(list);
    box.append(d);
  }
  return box;
}

function isUniversityTotal(requirement) {
  return /\btotal\s+\d+\s+credits?\b.*\buniversity degree completion\b/i
    .test(requirement.name || "");
}

function renderRequirement({requirement, courses}, descendantHasCourses) {
  const box = el("section", "requirement");
  const head = el("div", "req-head");
  const marker = requirement.slots
    ? String(requirement.slots).padStart(2, "0") : "!";
  head.append(el("span", "req-mark", marker));
  head.append(el("h2", "req-title", requirement.name));
  box.append(head);
  const detail = [];
  if (requirement.units_remaining)
    detail.push(`${requirement.units_remaining} units remaining`);
  detail.push(...(requirement.rules || []));
  if (detail.length) box.append(el("div", "req-meta", detail.join(" · ")));
  if (requirement.review) {
    box.append(el("p", "req-meta", requirement.review));
  } else if (courses.length) {
    box.append(el("span", "courses-label", "Courses that count toward this requirement"));
    const list = el("div", "course-list");
    courses.slice(0, 5).forEach(({course, secs}) =>
      list.append(renderCourse(course, secs)));
    if (courses.length > 5) {
      const more = el("details", "more-courses");
      more.append(el("summary", null,
        `${courses.length - 5} more ${courses.length - 5 === 1 ? "course" : "courses"} with open seats`));
      courses.slice(5).forEach(({course, secs}) =>
        more.append(renderCourse(course, secs)));
      list.append(more);
    }
    box.append(list);
  } else if (!descendantHasCourses && !isUniversityTotal(requirement)) {
    box.append(el("p", "req-meta", "No currently eligible course with an open seat."));
  }
  return box;
}

function subtreeHasCourses(node) {
  return node.branch.courses.length > 0
    || node.children.some(child => subtreeHasCourses(child));
}

function requirementTree(branches) {
  const root = {depth: -1, children: []};
  const stack = [root];
  for (const branch of branches) {
    while (stack[stack.length - 1].depth >= branch.requirement.depth) stack.pop();
    const node = {depth: branch.requirement.depth, branch, children: []};
    stack[stack.length - 1].children.push(node);
    stack.push(node);
  }
  return root;
}

function renderTreeNode(node, connected) {
  const item = el("div", "tree-node");
  if (connected) item.classList.add("connected");
  const descendantHasCourses = node.children.some(child => subtreeHasCourses(child));
  item.append(renderRequirement(node.branch, descendantHasCourses));
  if (node.children.length) {
    const children = el("div", "tree-children");
    node.children.forEach(child => children.append(renderTreeNode(child, true)));
    item.append(children);
  }
  return item;
}

function renderRequirementTree(branches) {
  const tree = el("div", "audit-tree");
  const root = requirementTree(branches);
  root.children.forEach(node => tree.append(renderTreeNode(node, false)));
  return tree;
}

function showStudent() {
  const bar = document.getElementById("who");
  const text = bar.querySelector(".whotext");
  text.replaceChildren();
  if (!DATA) { bar.hidden = true; return; }

  text.append(el("p","who", DATA.student.name
    + (DATA.student.level ? ` — ${DATA.student.level}` : "")));
  const meta = el("p","meta", DATA.student.programs.join(" · "));
  text.append(meta);
  bar.hidden = false;
}

function showProgress() {
  const status = document.getElementById("status");
  status.textContent = `Reading and processing data from Stellic and Self-Service. This may take a minute${".".repeat(loadingDots)}`;
}

async function showUpdate() {
  try {
    const response = await fetch("/api/update");
    const update = await response.json();
    if (!update.available || !update.prompt) return;
    document.getElementById("updateprompt").value = update.prompt;
    document.getElementById("update").hidden = false;
  } catch (err) {
    // The update notice is optional and must never interrupt advising work.
  }
}

async function pollProgress() {
  while (CHECKING) {
    try {
      const response = await fetch("/api/progress");
      await response.json();
    } catch (err) {
      // The audit request remains authoritative if this lightweight status
      // request is interrupted.
    }
    await new Promise(resolve => setTimeout(resolve, 450));
  }
}

async function check(ev) {
  ev.preventDefault();
  const url = document.getElementById("url").value.trim();
  if (!url) return;
  const go = document.getElementById("go");
  go.disabled = true;
  document.getElementById("out").replaceChildren();
  document.getElementById("who").hidden = true;
  document.getElementById("copypanel").hidden = true;
  CHECKING = true;
  loadingDots = 3;
  showProgress();
  loadingTimer = setInterval(() => {
    loadingDots += 1;
    showProgress();
  }, 1000);
  const progressPoll = pollProgress();

  try {
    const r = await fetch("/api/check?url=" + encodeURIComponent(url));
    const body = await r.json();
    if (!r.ok) throw new Error(body.error || ("HTTP " + r.status));
    DATA = body;

    const termSel = document.getElementById("term");
    termSel.replaceChildren();
    for (const t of DATA.terms) {
      const o = el("option",null,t.description); o.value = t.code; termSel.append(o);
    }
    if (DATA.terms.length) termSel.value = latestTerm(DATA.terms);
    // A dropdown holding one option is furniture, but the term still has to
    // be visible - so show it as plain text instead.
    const filters = document.getElementById("filters");
    const field = document.getElementById("termfield");
    const modality = document.getElementById("modality");
    const only = document.getElementById("termone");
    filters.hidden = DATA.terms.length === 0;
    modality.value = "any";
    modality.disabled = false;
    termSel.hidden = DATA.terms.length < 2;
    only.hidden = DATA.terms.length !== 1;
    if (DATA.terms.length === 1) only.textContent = DATA.terms[0].description;
    showStudent();
    render();
  } catch (err) {
    document.getElementById("status").textContent = "";
    const box = el("div","error");
    box.append(el("strong",null,"Could not read that audit. "));
    box.append(document.createTextNode(err.message));
    document.getElementById("out").append(box);
  } finally {
    CHECKING = false;
    clearInterval(loadingTimer);
    loadingTimer = null;
    await progressPoll;
    go.disabled = false;
  }
}

document.getElementById("form").addEventListener("submit", check);
document.getElementById("term").addEventListener("change", render);
document.getElementById("modality").addEventListener("change", render);

document.getElementById("copy").addEventListener("click", async () => {
  const box = document.getElementById("plain");
  const btn = document.getElementById("copy");
  try {
    await navigator.clipboard.writeText(box.value);
  } catch (e) {
    box.select(); document.execCommand("copy");   // older browsers
  }
  btn.textContent = "✓ Copied";
  setTimeout(() => { btn.textContent = "⧉ Copy"; }, 1600);
});

document.getElementById("copyupdate").addEventListener("click", async () => {
  const box = document.getElementById("updateprompt");
  const btn = document.getElementById("copyupdate");
  try {
    await navigator.clipboard.writeText(box.value);
  } catch (e) {
    box.select(); document.execCommand("copy");
  }
  btn.textContent = "✓ Copied";
  setTimeout(() => { btn.textContent = "⧉ Copy update prompt"; }, 1600);
});

// The box starts empty every time: an audit URL carries a student's username,
// which has no business outliving the session that looked it up. Clear anything
// an earlier version stored.
try { localStorage.removeItem("advisingbot.url"); } catch (e) {}
showUpdate();
</script>
