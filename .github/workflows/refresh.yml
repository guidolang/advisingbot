name: Refresh open seats

# Manual for now: run it from the Actions tab with "Run workflow".
#
# To make it automatic, uncomment the schedule below. GitHub cron is always
# UTC and does not follow daylight saving, so 10:00 UTC is 6:00 a.m. Eastern
# during EDT (mid-March to early November) and 5:00 a.m. during EST. If 6:00
# a.m. year-round matters, add the second entry and let the job run twice on
# the days that overlap - a second run is harmless, it just rewrites the file.
#
# schedule:
#   - cron: "0 10 * * *"   # 6:00 a.m. EDT / 5:00 a.m. EST
#   - cron: "0 11 * * *"   # 6:00 a.m. EST / 7:00 a.m. EDT

on:
  workflow_dispatch:
    inputs:
      programs:
        description: "Only programs matching this text (blank = all)"
        required: false
        default: ""

# Never let two refreshes write docs/data.json at once.
concurrency:
  group: refresh-open-seats
  cancel-in-progress: false

permissions:
  contents: write   # commit the refreshed data
  pages: write      # publish to GitHub Pages
  id-token: write   # required by deploy-pages

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The scripts are standard library only - 3.11+ for tomllib.
          python-version: "3.12"

      - name: Collect open seats from Self-Service
        run: |
          if [ -n "${{ inputs.programs }}" ]; then
            python3 build_site.py --programs "${{ inputs.programs }}"
          else
            python3 build_site.py
          fi

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --staged --quiet; then
            echo "No change in open seats since the last run."
          else
            git commit -m "Refresh open seats ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi

      # The three steps below publish docs/ to GitHub Pages. They need Pages
      # enabled for the repo with "GitHub Actions" as the source
      # (Settings -> Pages). On a private repo that requires a paid plan;
      # otherwise make the repo public - it holds no secrets.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
